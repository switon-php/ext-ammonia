name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
        with:
          php: ${{ matrix.php }}
          ts: ${{ matrix.ts }}
          upload: "true"

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ammonia-*.tar.gz | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: |
            Download `ammonia-<version>-php<php>-<nts|zts>-<linux|macos|windows>-<x64|arm64>.tar.gz` for this machine. Unpack it. The only file inside is `libammonia.so` on Linux, `libammonia.dylib` on macOS, or `ammonia.dll` on Windows. `php --ri ammonia` reports the version.

            ```ini
            extension=/path/libammonia.so
            ```

            On Windows the line is `extension=C:/path/ammonia.dll`. `extension=ammonia` loads `ammonia.so` on Linux and macOS, and `php_ammonia.dll` on Windows. It does not load `libammonia.so` or `ammonia.dll`. Linux builds are Ubuntu 24.04 glibc. Windows builds are x64.
          files: |
            dist/ammonia-*.tar.gz
            dist/SHA256SUMS
