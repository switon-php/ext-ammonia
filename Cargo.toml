[package]
name = "ammonia"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "PHP extension that sanitizes HTML with the ammonia crate"
repository = "https://github.com/switon-php/ext-ammonia"
publish = false

[lib]
name = "ammonia"
crate-type = ["cdylib", "lib"]

[dependencies]
ammonia_sanitizer = { package = "ammonia", version = "=4.2.4" }
ext-php-rs = "=0.16.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
